name: Export portable .NET 10 SDK

on:
  push:
    paths:
      - '.github/workflows/export-dotnet-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Install isolated .NET 10.0.403 SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dotnet-portable"
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --version 10.0.403 \
            --architecture x64 \
            --install-dir "$RUNNER_TEMP/dotnet-portable" \
            --no-path
          "$RUNNER_TEMP/dotnet-portable/dotnet" --info
      - name: Package isolated SDK
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/dotnet-portable" -czf "$RUNNER_TEMP/dotnet-sdk-10.0.403-linux-x64.tar.gz" .
          sha256sum "$RUNNER_TEMP/dotnet-sdk-10.0.403-linux-x64.tar.gz" > "$RUNNER_TEMP/dotnet-sdk-10.0.403-linux-x64.sha256"
          du -h "$RUNNER_TEMP/dotnet-sdk-10.0.403-linux-x64.tar.gz"
      - name: Upload portable SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-sdk-10.0.403-linux-x64-isolated
          path: |
            ${{ runner.temp }}/dotnet-sdk-10.0.403-linux-x64.tar.gz
            ${{ runner.temp }}/dotnet-sdk-10.0.403-linux-x64.sha256
          compression-level: 0
          retention-days: 1
